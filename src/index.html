<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=IE7">

  <meta property="og:site_name" content="Glitchy Waves">
  <meta name="twitter:site" content="Glitchy Waves">
  <meta name="theme-color" content="#0056D2">
  <meta name="description" content="Glitchy Waves - Explore, Play, and Surf the Glitched Web."/>
  <meta property="og:title" content="Glitchy Waves"/>
  <meta property="og:description" content="Glitchy Waves - Explore, Play, and Surf the Glitched Web."/>
  <meta property="og:image" content="/assets/images/icons/favicon.ico"/>
  <meta property="twitter:title" content="Glitchy Waves"/>
  <meta property="twitter:description" content="Glitchy Waves - Explore, Play, and Surf the Glitched Web."/>
  <meta property="twitter:image" content="/assets/images/icons/favicon.ico"/>
  <meta property="twitter:card" content="summary"/>
  <title>Glitchy Waves</title>

  <!-- Safe Assets (No ads) -->
  <link rel="preload" href="/assets/css/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" href="/assets/css/vendors/font-awesome/css/all.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" href="/assets/css/settings.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" href="/assets/css/games.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" href="/assets/css/toast.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" href="/assets/css/vendors/nprogress/nprogress.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />

  <noscript>
    <link rel="stylesheet" href="/assets/css/index.css" />
    <link rel="stylesheet" href="/assets/css/vendors/font-awesome/css/all.css" />
  </noscript>

  <!-- Malware-free Title Lock -->
  <script>
    (function () {
      const fixed = document.title;
      const obs = new MutationObserver(() => {
        if (document.title !== fixed) document.title = fixed;
      });
      obs.observe(document.querySelector('title'), { childList: true });
      Object.defineProperty(document, "title", { get: () => fixed, set: () => {} });
    })();
  </script>
</head>

<body>

  <!-- ❌ REMOVED: All /b?id= malware scripts -->
  <!-- ❌ REMOVED: All ad injections -->
  <!-- ❌ REMOVED: All support-me widgets -->
  <!-- ❌ REMOVED: Remote advertising or tracking -->

  <!-- SAFE CORE SCRIPTS -->
  <script src="/assets/js/core/load.js"></script>
  <script src="/assets/js/features/settings.js"></script>
  <script type="module" src="/assets/js/index.js"></script>
  <script src="/assets/js/core/register.js" defer></script>

  <nav class="sidebar">
    <div class="tabs-header"><span>Tabs</span></div>
    <button id="add-tab-btn"><i class="fa-regular fa-plus"></i> New Tab</button>
    <div id="tabs-container" class="tabs-container"></div>
  </nav>

  <main class="content-wrapper">

    <!-- Browser Bar -->
    <div class="main-header">
      <div class="nav-controls">
        <a id="toggle-sidebar-btn"><i class="fa-light fa-table-rows"></i></a>
        <a id="backIcon"><i class="fa-regular fa-chevron-left"></i></a>
        <a id="forwardIcon"><i class="fa-regular fa-chevron-right"></i></a>
        <a id="refreshIcon"><i class="fa-regular fa-rotate-right"></i></a>
      </div>

      <div class="omnibox">
        <i id="lockIcon" class="fa-regular fa-unlock-keyhole"></i>
        <input id="searchInputt" type="text" placeholder="Search or enter address">
        <div id="suggestions-container-nav" class="suggestions-box"></div>
      </div>

      <div class="window-controls">
        <a href="/"><i class="fa-regular fa-house-chimney-window"></i></a>
        <a id="fullscreenBtn"><i class="fa-regular fa-expand"></i></a>
        <a id="splitViewBtn"><i class="fa-regular fa-table-columns"></i></a>
        <a id="erudaBtn"><i class="fa-regular fa-square-code"></i></a>
      </div>
    </div>

    <div id="left-icons">
      <div id="branding-container" class="icon-btn">
        <span id="brand"></span>
        <div id="oneko"></div>
      </div>

      <!-- Games Button -->
      <a id="games" class="icon-btn" title="Games">
        <i class="fa-solid fa-gamepad-modern"></i>
      </a>

      <!-- Movies Button (New) -->
      <a id="movies" class="icon-btn" title="Movies">
        <img src="https://raw.githubusercontent.com/NOTAHACKER9999/waves/refs/heads/main/Custom/Logos/Movies.png"
             style="width:38px;height:38px;border-radius:8px;">
      </a>
    </div>

    <div id="settings-menu" class="settings-menu"></div>
    <div id="overlay" class="overlay"></div>

    <div id="iframe-container"></div>

    <!-- Movies Overlay -->
    <div id="moviesOverlay" style="
      display:none;position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
      justify-content:center;align-items:center;z-index:9999;
    ">
      <div style="position:relative;width:80%;height:80%;background:#000;
        border-radius:12px;overflow:hidden;box-shadow:0 0 25px #000;">
        <button id="closeMovies" style="
          position:absolute;top:10px;right:15px;font-size:28px;
          background:none;border:none;color:white;cursor:pointer;">&times;
        </button>
        <iframe src="https://glitch-flix.vercel.app/"
          style="width:100%;height:100%;border:0;border-radius:12px;"
          allowfullscreen></iframe>
      </div>
    </div>

    <!-- Run Games, Toast, Shortcuts -->
    <script src="/assets/js/features/games.js" defer></script>
    <script src="/assets/js/features/shortcuts.js" defer></script>
    <script src="/assets/js/features/toast.js" defer></script>
    <script src="/assets/js/vendors/nprogress/nprogress.js" defer></script>

    <script>
      document.getElementById("brand").textContent = "Glitchy Waves";

      // Movies overlay script
      const movies = document.getElementById("movies");
      const overlay = document.getElementById("moviesOverlay");
      const closeBtn = document.getElementById("closeMovies");

      movies.onclick = () => overlay.style.display = "flex";
      closeBtn.onclick = () => overlay.style.display = "none";
      overlay.onclick = e => { if (e.target === overlay) overlay.style.display = "none"; };

      // 🚫 Block spaniardinformationbookworm.com in browser bar input
      const searchInput = document.getElementById("searchInputt");
      searchInput.addEventListener("input", () => {
        const blocked = ["spaniardinformationbookworm.com"];
        const val = searchInput.value.toLowerCase();
        for (const domain of blocked) {
          if (val.includes(domain)) {
            searchInput.value = "";
            alert("Access to this domain is blocked for security reasons.");
            break;
          }
        }
      });
    </script>

  </main>
</body>
</html>
