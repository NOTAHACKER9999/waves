  <!-- Title Lock -->
  <script>
    (function () {
      const fixed = document.title;
      const obs = new MutationObserver(() => {
        if (document.title !== fixed) document.title = fixed;
      });
      obs.observe(document.querySelector('title'), { childList: true });
      Object.defineProperty(document, "title", { get: () => fixed, set: () => {} });
    })();
  </script>

  <!-- 🔥 FULL MALWARE BLOCKER (DOMAIN + IP + SCRIPTS + SW + IFRAME + FETCH) -->
  <script>
    const BLOCKED_HOSTS = [
      "spaniardinformationbookworm.com",
      "www.spaniardinformationbookworm.com"
    ];

    const BLOCKED_IPS = [
      "172.240.253.132"
    ];

    function isBlocked(url) {
      url = url.toString().toLowerCase();
      return BLOCKED_HOSTS.some(h => url.includes(h)) ||
             BLOCKED_IPS.some(ip => url.includes(ip));
    }

    /* 🧱 Block iframe loading */
    const realSet = HTMLIFrameElement.prototype.setAttribute;
    HTMLIFrameElement.prototype.setAttribute = function (name, value) {
      if (name === "src" && value && isBlocked(value)) {
        console.warn("Blocked malicious iframe:", value);
        this.srcdoc = "<h1 style='color:red;text-align:center;margin-top:20%;'>Blocked Malicious Site</h1>";
        return;
      }
      return realSet.call(this, name, value);
    };

    /* 🧱 Block fetch() */
    const realFetch = window.fetch;
    window.fetch = function (url, opts) {
      if (isBlocked(url)) {
        console.warn("Blocked malicious fetch:", url);
        return Promise.reject("Blocked malicious request");
      }
      return realFetch(url, opts);
    };

    /* 🧱 Block script injection */
    const realAppend = Element.prototype.appendChild;
    Element.prototype.appendChild = function (el) {
      if (el.tagName === "SCRIPT" && el.src && isBlocked(el.src)) {
        console.warn("Blocked malicious script:", el.src);
        return el;
      }
      return realAppend.call(this, el);
    };

    /* 🧱 Block dynamic import() */
    const realImport = window.import;
    window.import = function (u) {
      if (isBlocked(u)) {
        console.warn("Blocked malicious import:", u);
        return Promise.reject("Blocked malicious module");
      }
      return realImport(u);
    };

    /* 🧱 Block Service Workers */
    if ("serviceWorker" in navigator) {
      const realSW = navigator.serviceWorker.register;
      navigator.serviceWorker.register = function (url, opts) {
        if (isBlocked(url)) {
          console.warn("Blocked malicious SW:", url);
          return Promise.reject("Blocked SW");
        }
        return realSW.call(navigator.serviceWorker, url, opts);
      };
    };

    /* 🧱 Block entering URL in omnibox */
    window.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("searchInputt");
      if (!input) return;
      input.addEventListener("input", () => {
        const v = input.value;
        if (isBlocked(v)) {
          input.value = "";
          alert("⚠ Blocked malicious site");
        }
      });
    });

  </script>

</head>

<body>

  <!-- SAFE CORE SCRIPTS -->
  <script src="/assets/js/core/load.js"></script>
  <script src="/assets/js/features/settings.js"></script>
  <script type="module" src="/assets/js/index.js"></script>
  <script src="/assets/js/core/register.js" defer></script>

  <nav class="sidebar">
    <div class="tabs-header"><span>Tabs</span></div>
    <button id="add-tab-btn"><i class="fa-regular fa-plus"></i> New Tab</button>
    <div id="tabs-container" class="tabs-container"></div>
  </nav>

  <main class="content-wrapper">

    <!-- Browser Bar -->
    <div class="main-header">
      <div class="nav-controls">
        <a id="toggle-sidebar-btn"><i class="fa-light fa-table-rows"></i></a>
        <a id="backIcon"><i class="fa-regular fa-chevron-left"></i></a>
        <a id="forwardIcon"><i class="fa-regular fa-chevron-right"></i></a>
        <a id="refreshIcon"><i class="fa-regular fa-rotate-right"></i></a>
      </div>

      <div class="omnibox">
        <i id="lockIcon" class="fa-regular fa-unlock-keyhole"></i>
        <input id="searchInputt" type="text" placeholder="Search or enter address">
        <div id="suggestions-container-nav" class="suggestions-box"></div>
      </div>

      <div class="window-controls">
        <a href="/"><i class="fa-regular fa-house-chimney-window"></i></a>
        <a id="fullscreenBtn"><i class="fa-regular fa-expand"></i></a>
        <a id="splitViewBtn"><i class="fa-regular fa-table-columns"></i></a>
        <a id="erudaBtn"><i class="fa-regular fa-square-code"></i></a>
      </div>
    </div>

    <div id="left-icons">
      <div id="branding-container" class="icon-btn">
        <span id="brand"></span>
        <div id="oneko"></div>
      </div>

      <a id="games" class="icon-btn" title="Games">
        <i class="fa-solid fa-gamepad-modern"></i>
      </a>

      <a id="movies" class="icon-btn" title="Movies">
        <img src="https://raw.githubusercontent.com/NOTAHACKER9999/waves/refs/heads/main/Custom/Logos/Movies.png"
             style="width:38px;height:38px;border-radius:8px;">
      </a>
    </div>

    <div id="settings-menu" class="settings-menu"></div>
    <div id="overlay" class="overlay"></div>

    <div id="iframe-container"></div>

    <!-- Movies Overlay -->
    <div id="moviesOverlay" style="
      display:none;position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);
      justify-content:center;align-items:center;z-index:9999;
    ">
      <div style="position:relative;width:80%;height:80%;background:#000;
        border-radius:12px;overflow:hidden;box-shadow:0 0 25px #000;">
        <button id="closeMovies" style="
          position:absolute;top:10px;right:15px;font-size:28px;
          background:none;border:none;color:white;cursor:pointer;">&times;
        </button>
        <iframe src="https://glitch-flix.vercel.app/"
          style="width:100%;height:100%;border:0;border-radius:12px;"
          allowfullscreen></iframe>
      </div>
    </div>

    <script src="/assets/js/features/games.js" defer></script>
    <script src="/assets/js/features/shortcuts.js" defer></script>
    <script src="/assets/js/features/toast.js" defer></script>
    <script src="/assets/js/vendors/nprogress/nprogress.js" defer></script>

    <script>
      document.getElementById("brand").textContent = "Glitchy Waves";

      const movies = document.getElementById("movies");
      const overlay = document.getElementById("moviesOverlay");
      const closeBtn = document.getElementById("closeMovies");

      movies.onclick = () => overlay.style.display = "flex";
      closeBtn.onclick = () => overlay.style.display = "none";
      overlay.onclick = e => { if (e.target === overlay) overlay.style.display = "none"; };
    </script>

  </main>
</body>
