  <script>
    (function() {
      const fixedTitle = document.title;
      const titleObserver = new MutationObserver(() => {
        if (document.title !== fixedTitle) {
          document.title = fixedTitle;
        }
      });
      const titleElement = document.querySelector('title');
      if (titleElement) {
        titleObserver.observe(titleElement, { childList: true });
      }
      Object.defineProperty(document, 'title', {
        get: function() { return fixedTitle; },
        set: function(_) {}
      });
    })();
  </script>

<body>
  <script>
    (function () {
      const encS = "c2NyYW1qZXQ=";
      const encU = "dWx0cmF2aW9sZXQ=";
      const decode = str => atob(str);
      let backend = decode(encS);
      try {
        const storedBackend = localStorage.getItem('backend');
        if (storedBackend === decode(encU)) {
          backend = decode(encU);
        }
      } catch (e) {}
      document.write(unescape('%3Cscript src="/b?id=1"%3E%3C/script%3E'));
      if (backend === decode(encS)) {
        document.write(unescape('%3Cscript src="/b?id=2"%3E%3C/script%3E'));
      } else {
        document.write(unescape('%3Cscript src="/b?id=3"%3E%3C/script%3E'));
        document.write(unescape('%3Cscript src="/b?id=4"%3E%3C/script%3E'));
      }
    })();
  </script>

    <script>
      const encoded = "R2xpdGNoeSBXYXZlcw==";
      document.getElementById("brand").textContent = atob(encoded);

  <script>
    const popupAd = document.getElementById('popupAd');
